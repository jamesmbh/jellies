<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jellyfish</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="sea" aria-label="ASCII jellyfish drifting through a dark ocean"></canvas>

  <!-- Info panel: shown when a jellyfish is zoomed in on (double-click).
       Filled in by jellyfish.js from the INFO data. -->
  <aside id="info" class="info" hidden aria-live="polite"></aside>

  <!-- Scene navigation: ↑ / ↓ between surface, open water and seabed.
       Filled in by jellyfish.js. -->
  <nav id="scene-nav" class="scene-nav" aria-label="Depth"></nav>

  <!-- The deep-sea cave room (through the portal in open water). -->
  <div id="room-ui" class="room-ui" hidden>
    <div class="room-ui__title">
      <p class="room-ui__eyebrow">Deep sea · usually 500–1,500 m down</p>
      <h2>Atolla jellyfish</h2>
      <p class="room-ui__latin">Atolla wyvillei · bell up to ~15 cm across</p>
      <p class="room-ui__hint">Hover over its parts to learn about them · drag to turn it round · click it to set off its alarm</p>
    </div>
    <button class="room-ui__exit" type="button">← Swim back out</button>
    <div class="room-ui__tip" hidden></div>
  </div>

  <script src="jellyfish.js"></script>
</body>
</html>
